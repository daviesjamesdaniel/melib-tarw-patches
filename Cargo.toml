[package]
name = "melib"
version = "0.9.0"
authors = ["Manos Pitsidianakis <manos@pitsidianak.is>"]
homepage = "https://meli-email.org"
repository = "https://git.meli-email.org/meli/meli.git"
description = "library for e-mail clients and other e-mail applications"
keywords = ["mail", "mua", "maildir", "imap", "jmap"]
categories = ["email", "parser-implementations"]
license = "EUPL-1.2 OR GPL-3.0-or-later"
edition = "2021"
build = "build.rs"
rust-version = "1.88.0"

[lib]
name = "melib"
path = "src/lib.rs"

[features]
default = ["imap", "nntp", "maildir", "mbox-notify", "smtp", "webdav"]

gpgme = []
http = ["isahc", "dep:http", "url/serde", "dep:http"]
http-static = ["isahc", "isahc/static-curl"]
imap = ["imap-codec", "imap-types", "tls"]
jmap = ["http"]
maildir = ["notify"]
mbox-notify = ["notify"]
nntp = ["tls"]
notmuch = ["maildir"]
sequoia = ["dep:sqz"]
smtp = ["tls"]
sqlite3 = ["sqlite3-static"]
sqlite3-static = ["rusqlite", "rusqlite/bundled-full"]
tls = ["native-tls"]
tls-static = ["tls", "native-tls/vendored"]
webdav = ["http", "dep:quick-xml", "dep:http"]

[dependencies]
async-fn-stream = { version = "0.3" }
async-io = { version = "2" }
base64 = { version = ">= 0.13, <= 0.22" }
bitflags = { version = "2.10", features = ["serde"] }
cfg-if = { version = "^1.0.0" }
chrono = { version = "^0.4", default-features = false }
data-encoding = { version = "2.9" }
encoding_rs = { version = "^0.8" }
flate2 = { version = "1" }
futures = { version = "0.3.34", default-features = false, features = ["async-await", "executor", "std"] }
http = { version = "0.2.12", optional = true }
imap-codec = { version = "=2.0.0-alpha.6", features = ["ext_condstore_qresync", "ext_id"], optional = true }
imap-types = { version = "=2.0.0-alpha.6", features = ["ext_condstore_qresync", "ext_id"], optional = true }
indexmap = { version = "^2.3", default-features = false, features = ["serde", "std"] }
isahc = { version = "^1.7.2", optional = true, default-features = false, features = ["http2", "json", "text-decoding"] }
libc = { version = "0.2", features = ["extra_traits"] }
libloading = { version = "0.8" }
log = { version = "0.4", features = ["std"] }
native-tls = { version = "0.2", default-features = false, optional = true }
nix = { version = "0.30", default-features = false, features = ["fs", "socket", "dir", "hostname"] }
nom = { version = "7" }
notify = { version = "8", optional = true }
polling = { version = "3" }
quick-xml = { version = "0.31.0", optional = true, features = ["serialize"] }
regex = { version = "1" }
rusqlite = { version = "^0.40", default-features = false, features = ["array", "modern_sqlite"], optional = true }
serde = { version = "1", features = ["rc"] }
serde_derive = { version = "1" }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = { version = "0.1" }
smallvec = { version = "^1.15", features = ["serde"] }
smol = { version = "2" }
socket2 = { version = "0.6", features = [] }
sqz = { version = "0.1.0", optional = true, default-features = false, features = ["crypto-nettle"] }
unicode-segmentation = { version = "1.2.1", default-features = false }
url = { version = "2.5" }
uuid = { version = "^1", features = ["serde", "v4", "v5"] }
xdg = { version = "2.1.0" }

[dev-dependencies]
rusty-fork = { version = "0.3.0" }
# Doctests derive Deserialize; inside meli's workspace another member
# enables this feature through feature unification.
serde = { version = "1", features = ["derive"] }
serde_test2 = { version = "2" }
tempfile = { version = "3.3" }
toml = { version = "0.8", default-features = false, features = ["display", "preserve_order", "parse"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
redundant_explicit_links = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
large_include_file = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
rc_buffer = "deny"
as_underscore = "deny"
assertions_on_result_states = "deny"
doc_markdown = "deny"
expect_fun_call = "deny"
or_fun_call = "deny"
bool_to_int_with_if = "deny"
borrow_as_ptr = "deny"
cast_ptr_alignment = "deny"
large_futures = "deny"
waker_clone_wake = "deny"
unused_enumerate_index = "deny"
unnecessary_fallible_conversions = "deny"
struct_field_names = "deny"
manual_hash_one = "deny"
into_iter_without_iter = "deny"
# allow_attributes = "deny"
# allow_attributes_without_reason = "deny"
# arithmetic_side_effects = "deny"
# as_conversions = "deny"
as_pointer_underscore = "deny"
cfg_not_test = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
unused_trait_names = "deny"
verbose_file_reads = "deny"

option_if_let_else = "allow"
missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
multiple_crate_versions = "allow"
significant_drop_in_scrutinee = "allow"
cognitive_complexity = "allow"
manual_clamp = "allow"
coerce_container_to_any = "allow"
collapsible_match = "allow"
